# Keeps the live site warm: pings the home page and the health endpoint on a schedule.
# Set the repository variable SITE_URL (Settings → Secrets and variables → Actions → Variables),
# e.g. https://clvry.vercel.app — without it the job skips.
name: Keep site active

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (GitHub may delay scheduled runs a few minutes)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL is not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 -o /dev/null -w "home: %{http_code} in %{time_total}s\n" "$SITE_URL/"
          curl --fail --silent --show-error --max-time 30 -w "\nhealth: %{http_code} in %{time_total}s\n" "$SITE_URL/api/health"
